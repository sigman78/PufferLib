[base]
env_name = starmelee

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 8

[policy]
; Keep in sync with make_puffernet() in ocean/starmelee/starmelee.c
hidden_size = 128
num_layers = 1

[env]
; Torus side length in world units (3x the original 360: room to flee,
; reposition, and use asteroid cover between passes).
size = 1080
; Ships per env. Must divide total_agents and total_agents/num_buffers.
num_ships = 2
; Per-ship episode step limit.
max_ticks = 1500
; Forward acceleration while the engine is held (force / mass).
thrust = 0.05
; Angular acceleration while turning (torque / inertia).
turn_accel = 0.004
; Hard clamp on angular speed, rad per tick.
max_turn_rate = 0.06
; Angular velocity retention per tick.
angular_damping = 0.95
; Linear velocity retention per tick (space, so nearly 1).
linear_damping = 0.999
; Thrust cannot push speed above this; gravity slingshots can.
max_speed = 2.0
; Gravity acceleration at the planet surface.
gravity = 0.22
; Falloff exponent p in a(r) = gravity * (planet_radius/r)^p. True
; inverse-square (2.0) is barely felt beyond ~3 planet radii at these
; thrust levels; 1.5 keeps the well relevant out to ~10 radii while
; leaving spawn distance escapable at full thrust.
gravity_falloff = 1.5
planet_radius = 12.0
ship_radius = 6.0
; Beacon capture radius.
goal_radius = 14.0
hp_max = 100.0
; HP lost per unit of normal impact speed when bouncing off the planet.
; Reward pain per hit is damage / hp_max, so this also scales the
; collision penalty.
damage_scale = 30.0
; Bounce elasticity, 0..1.
restitution = 0.5
; Per-step time pressure. Milder in duel mode: cycles pay out over a
; longer horizon than a single beacon run.
step_penalty = -0.002
; Reward per (goal distance shrink / size).
progress_scale = 2.0
; Min spawn/beacon distance from the planet center, world units.
spawn_clearance = 48.0
; Min spawn-to-beacon distance as a fraction of size.
min_goal_frac = 0.3
; Reward lost per button state change per decision: punishes jittery
; on/off dithering without taxing sustained holds. 0 disables.
; Keep small: at 0.01 the toggle tax outweighed the entropy bonus and
; exploration collapsed (policy froze its inputs and drifted into the
; planet); 0.003 trains fine. action_repeat is the structural jitter fix.
input_change_penalty = 0.003
; Physics ticks each decision is latched for. 4 = ~15 decisions/sec at
; the 60 Hz physics rate: human-cadence inputs, physically capped toggle
; frequency, and shorter credit-assignment chains.
action_repeat = 4

; --- Duel (combat) mode: engage -> burst -> reload-flee cycles ---
; 0 = phase-1 beacon navigation, 1 = duel the other ship.
combat = 1
; Engagement band in world units: where approach shaping pulls the ship
; and where tracking (aim/strafe) shaping pays. Centered on the preferred
; attack distance of ~3 ship sizes (36 at ship_radius 6) and kept inside
; projectile_range so shots fired in-band can actually connect.
attack_range_min = 30.0
attack_range_max = 42.0
; Max bearing error that counts as tracking, radians.
aim_cone = 0.15
; Distance that completes the reload-flee disengage.
disengage_range = 120.0
; Shaping scale for closing on the band / opening distance while fleeing.
engage_scale = 2.0
; Per-tick reward for tracking the enemy inside the band.
aim_reward = 0.01
; Per-tick bonus for transverse (strafing) velocity while tracking.
strafe_reward = 0.005
; Landing a projectile hit. Sized so a hit step plus its shaping stays
; inside the trainer's [-1, 1] per-step clamp.
hit_reward = 0.75
; Per-shot trigger-discipline nudge: firing while tracking within
; projectile_range pays +this, any other shot pays -this. 0 disables.
fire_nudge = 0.05
; Completing the disengage after a burst empties the magazine. Paid only
; if at least one round of that magazine connected: hitless bursts must
; not fund a no-contact farming loop for the shared self-play policy.
cycle_reward = 0.4
; Charged to the ship a projectile hit: drives evasion and using the
; planet as a line-of-sight shield (the planet soaks shots physically).
targeted_penalty = 0.5
; Hp a projectile hit takes off the victim (scaled by its fragility).
; Real damage keeps exchanges from being positive-sum for the pair
; (pure reward stings made cooperative shot-feeding the self-play
; optimum) and is what makes wounded ships actually retreat.
shot_damage = 15.0
; Duel spawn separation as a fraction of size. 0.12 of the 3x arena
; keeps the opening distance close to the old 0.35 * 360.
duel_spawn_frac = 0.12
; Per-spawn trait multipliers sampled in 1 +- this range for thrust,
; turning, top speed, fragility (damage taken), and caution (sting of
; being fired at). The ship observes its own build, so one policy
; expresses different behavior per draw and duels stop looking mirrored.
trait_variation = 0.25
; Small per-tick reward for waiting out a reload (or retreat) beyond
; disengage_range instead of hovering at the band edge.
loiter_reward = 0.002
; Below this hp fraction the ship abandons its cycle and RETREATs
; (escape shaping only) until hp recovers 15 points above. 0 disables.
retreat_hp_frac = 0.5
; Shield regen per tick while beyond disengage_range: makes backing off
; the way a wounded ship earns its return to the fight.
hp_regen = 0.1

; --- Spacing: keep apart, no ramming ---
; Keep-out bubble around the enemy (~2 ship sizes): being inside costs
; too_close_penalty per tick, scaled by intrusion depth.
close_range = 24.0
too_close_penalty = 0.02
; Inside avoid_range (~6 ship sizes) a relative velocity whose projected
; pass would enter the keep-out bubble is a collision course and pays
; collision_course_penalty per tick scaled by closing speed. Oblique
; passes and orbits are free; head-on rams are not.
avoid_range = 72.0
collision_course_penalty = 0.01

; --- Cannon: real projectiles replace the old pretend aim-passes ---
; Fire is the 4th action button (free fire): any state may shoot while a
; chambered round is off cooldown. fire_nudge shapes shots toward
; tracking-in-range; emptying the magazine starts the reload, which
; forces the flee leg of the cycle when on duty.
; Magazine size. If cannon_rounds_max is raised above cannon_rounds, each
; spawn samples its magazine in [rounds, max] like the other ship traits
; (readable through the ammo obs, normalized by cannon_rounds_max).
cannon_rounds = 3
cannon_rounds_max = 3
; Ticks (60 Hz) between rounds within a salvo: 10 = the whole 3-round
; magazine leaves in ~0.33 s, then the reload runs.
cannon_interval_ticks = 10
; Ticks to refill an empty magazine: 120 = 2 s spent fleeing.
cannon_reload_ticks = 120
; Muzzle speed added along the heading on top of the shooter's velocity.
; Faster than max_speed (2.0) so shots overtake a fleeing target.
projectile_speed = 3.0
; Flight distance at muzzle speed before the round dissolves
; (~4 ship diameters at ship_radius 6). Also the fire-gate distance.
projectile_range = 48.0

; --- Asteroids: straight-line hazards, gravity does not touch them ---
; How many rocks are in flight (0 disables the hazard). 4 in the 3x
; arena; each has its own stable obs slot (compile-time max 4). Cannon
; fire breaks them, so rocks double as destructible cover.
num_asteroids = 4
; Nominal radius; each spawn varies it +-25%.
asteroid_radius = 7.0
; Hp an impact costs (scaled by the ship's fragility trait). The rock
; disintegrates on any contact, ship or planet. Blindfold tests showed
; agents rationally ignore rocks below ~30 damage: rare mild stings are
; cheaper than bending combat trajectories. Two hits at 50 kill, which
; is what finally makes dodging worth learning.
asteroid_damage = 50.0
; Spawn speed range; the max is clamped to max_speed / 2.
asteroid_speed_min = 0.3
asteroid_speed_max = 1.0
; Ticks before a destroyed rock respawns (away from ships, new heading).
asteroid_respawn_ticks = 300
; Hazard pain (planet and asteroid stings) scales by up to (1 + this)
; as hp empties: a wounded ship should fear collisions more.
danger_hp_weight = 1.0

[train]
total_timesteps = 300_000_000
gamma = 0.99
learning_rate = 0.003
minibatch_size = 32768
ent_coef = 0.01
